services:
  - type: web
    name: marketplace
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WAVE_API_KEY
        sync: false
      - key: WAVE_SIGNING_SECRET
        sync: false
      - key: WAVE_WEBHOOK_SECRET
        sync: false
databases:
  - name: marketplace-db
    plan: free
