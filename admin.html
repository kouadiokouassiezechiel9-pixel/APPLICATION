<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
body{font-family:"Space Grotesk",system-ui,sans-serif;max-width:900px;margin:0 auto;padding:16px;line-height:1.45;background:#090a0b;color:#f7fafb}
h1,h2{font-family:"Oswald",Impact,sans-serif;text-transform:uppercase;color:#02d2e3;line-height:.95}
input,button{padding:11px 12px;margin:4px 6px 4px 0;font:inherit;border-radius:2px;border:1px solid #2a2d36}
input{background:rgba(255,255,255,.04);color:#f7fafb}
input:focus{outline:1px solid #02d2e3}
button{background:#02d2e3;color:#090a0b;border:0;font-weight:700;text-transform:uppercase;font-size:.8rem;cursor:pointer;clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%)}
button:hover{background:#fff}
.row{background:#1b1d24;border:1px solid #2a2d36;padding:10px;margin:6px 0}
code{background:#1b1d24;color:#02d2e3;padding:2px 6px;word-break:break-all}
</style></head><body>
<h1>Administration</h1>
<div id="login">
 <input id="email" type="email" placeholder="E-mail"><br>
 <input id="password" type="password" placeholder="Mot de passe"><br>
 <button id="go">Continuer</button></div>
<div id="step2" hidden>
 <p id="setup" hidden>Première connexion : dans votre application d'authentification (Google Authenticator, Authy...), ajoutez un compte par saisie manuelle avec cette clé : <code id="secret"></code></p>
 <input id="code" inputmode="numeric" maxlength="6" placeholder="Code à 6 chiffres"><br>
 <button id="verify">Valider</button></div>
<div id="dash" hidden>
 <button id="logout">Déconnexion</button>
 <h2>Statistiques</h2><p id="stats"></p>
 <h2>Commerçants en attente</h2><div id="pending"></div>
 <h2>Produits (modération)</h2><div id="arts"></div>
 <h2>Utilisateurs</h2><div id="users"></div></div>
<script src="/admin.js"></script></body></html>
